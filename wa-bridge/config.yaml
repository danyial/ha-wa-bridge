name: "WhatsApp Bridge"
version: "3.0.0-rc.4"
slug: "ha_wa_bridge"
description: "WhatsApp Web Bridge for Home Assistant"
url: "https://github.com/danyial/ha-wa-bridge"
arch:
  - aarch64
  - amd64
image: "ghcr.io/danyial/ha-wa-bridge"
startup: application
discovery:
  - whatsapp
boot: auto
options:
  detect_own_messages: false
  incoming_messages_mode: "all"
  incoming_message_log_level: "COMPACT"
  allowed_groups: []
  allowed_numbers: []
schema:
  detect_own_messages: bool
  incoming_messages_mode: "match(all|disabled|groups_only|numbers_only)"
  incoming_message_log_level: "match(FULL|COMPACT|NONE)"
  allowed_groups: [str]
  allowed_numbers: [str]
  wa_web_version: "str?"
  auth_token: "password?"
  restart_unresponsive_minutes: "int(0,)?"
ports:
  # Not published on the host by default: Home Assistant reaches the bridge on
  # the internal add-on network. Set a host port only for external clients.
  3000/tcp: null
