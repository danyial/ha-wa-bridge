configuration:
  detect_own_messages:
    name: Detect Own Messages (works in groups only)
    description: >-
      When enabled, messages sent from your own WhatsApp account (e.g. via WhatsApp Web
      or your phone) triggers the sound notification.
      Note: this only works inside group chats, not in 1-to-1 conversations.
  incoming_messages_mode:
    name: Incoming Messages Mode
    description: >-
      Controls which incoming messages are forwarded to Home Assistant.
      'all' = everything (default); 'disabled' = nothing, send-only mode;
      'groups_only' = group messages only; 'numbers_only' = direct messages from
      numbers listed in Allowed Numbers only.
  incoming_message_log_level:
    name: Incoming Message Log Level
    description: >-
      Controls the amount of detail logged when receiving messages or poll votes.
      'COMPACT' = sender and message type only (default); 'FULL' = entire message
      including its text (private data in the add-on log); 'NONE' = no logging.
  allowed_groups:
    name: Allowed Groups
    description: >-
      Optional. When set, only messages from group chats whose name exactly matches
      one of these entries will be forwarded. Leave empty to apply no group filter.
  allowed_numbers:
    name: Allowed Numbers
    description: >-
      Optional. Phone numbers in international format without '+' (e.g. 40741234567).
      When set, only messages from these numbers are forwarded. Required for
      'numbers_only' mode; also works as an extra filter in 'all' mode.
  wa_web_version:
    name: WhatsApp Web version (emergency pin)
    description: >-
      Leave empty to always load the current WhatsApp Web version (recommended).
      Only set a version such as 2.3000.1017054665 if the current one breaks the
      bridge; a pinned version stops working once WhatsApp retires it.
  auth_token:
    name: Access token (optional)
    description: >-
      Token that clients must send to use the bridge. Leave empty: a random token
      is generated and handed to Home Assistant automatically (discovery). Set it
      only for external clients, then enter the same value in the integration.
  restart_unresponsive_minutes:
    name: Restart when unresponsive (minutes)
    description: >-
      If WhatsApp Web reports ready but stops answering, restart it after this many
      minutes. Empty or 0: only report it (status "unresponsive") and log a warning.
network:
  3000/tcp: WebSocket for external clients (token required; not needed for Home Assistant)
